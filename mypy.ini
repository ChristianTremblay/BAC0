[mypy]
ignore_missing_imports = True
check_untyped_defs = True
warn_unused_configs = True
warn_return_any = False
disable_error_code = attr-defined,union-attr,var-annotated,misc
files = BAC0/core/devices/local/object.py,BAC0/core/app/*
# Exclude build output and common distribution folders to avoid duplicate
# module discovery (e.g. build/lib/BAC0 vs BAC0/BAC0).
# This regex covers both runs from the repo root and from the package folder
# on Windows and POSIX paths.
exclude = ^(?:.*[\\/])?(?:build|dist|\.eggs)(?:[\\/]|$)
# Make mypy treat implicit Optional the old way to reduce a large number of
# compatibility errors in a gradual typing migration. Set project Python
# version for better inference.
no_implicit_optional = False
python_version = 3.11
